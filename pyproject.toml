[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openwakeword"
version = "0.6.0"
authors = [
  { name="David Scripka", email="david.scripka@gmail.com" },
]
description = "An open-source audio wake word (or phrase) detection framework with a focus on performance and simplicity"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "onnxruntime>=1.17.0,<2",
    'ai-edge-litert>=2.0.2,<3; platform_system == "Linux" or platform_system == "Darwin"',
    'speexdsp-ns>=0.1.2,<1; platform_system == "Linux"',
    "tqdm>=4.0,<5.0",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "requests>=2.0,<3",
    'PyAudioWPatch; platform_system == "Windows" and platform_machine == "AMD64"',
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.0,<7",
    "pytest-flake8>=1.3.0,<2",
    "flake8>=5.0,<8",
    "pytest-mypy>=0.10.3,<1",
    "types-requests",
    "types-PyYAML",
    "mock>=5.1,<6",
    "types-mock>=5.1,<6",
]
# Training/conversion extras. Note: `tensorflow-cpu==2.8.1`, `tensorflow_probability==0.16.0`,
# `onnx_tf==1.10.0`, and `deep-phonemizer==0.0.19` do not provide wheels for Python 3.12+.
# Use Python 3.10 for full training (or skip ONNX->TFLite conversion and stay on 3.12).
full = [
    "mutagen>=1.46.0,<2",
    "torch>=1.13.1,<3",
    "torchaudio>=0.13.1,<3",
    "torchinfo>=1.8.0,<2",
    "torchmetrics>=0.11.4,<2",
    "speechbrain>=0.5.14,<2",
    "audiomentations>=0.30.0,<1",
    "torch-audiomentations>=0.11.0,<1",
    "tqdm>=4.64.0,<5",
    "pytest>=7.4,<9",
    "pytest-cov>=4.0,<7",
    "pytest-flake8>=1.3.0,<2",
    "pytest-mypy>=0.10.3,<1",
    "acoustics>=0.2.6,<1",
    "pyyaml>=6.0,<7",
    "tensorflow-cpu==2.8.1",
    "tensorflow_probability==0.16.0",
    "protobuf>=3.20,<4",
    "onnx_tf==1.10.0",
    "onnx==1.14.0",
    "pronouncing>=0.2.0,<1",
    "datasets>=2.14.4,<3",
    "deep-phonemizer==0.0.19",
]

[project.urls]
Homepage = "https://github.com/dscripka/openWakeWord"
"Bug Tracker" = "https://github.com/dscripka/openWakeWord/issues"

[tool.setuptools.packages.find]
include = ["openwakeword*"]

[tool.pytest.ini_options]
addopts = "--cov=openwakeword --cov-report term-missing --flake8 --mypy --mypy-ignore-missing-imports"
flake8-max-line-length = "140"
testpaths = [
    "tests",
    "openwakeword"
]
