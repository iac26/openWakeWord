[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openwakeword"
version = "0.6.0"
authors = [
  { name="David Scripka", email="david.scripka@gmail.com" },
]
description = "An open-source audio wake word (or phrase) detection framework with a focus on performance and simplicity"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "onnxruntime>=1.17.0,<2",
    'speexdsp-ns>=0.1.2,<1; platform_system == "Linux"',
    "tqdm>=4.0,<5.0",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "requests>=2.0,<3",
    'PyAudioWPatch; platform_system == "Windows" and platform_machine == "AMD64"',
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.0,<7",
    "pytest-flake8>=1.3.0,<2",
    "flake8>=5.0,<8",
    "pytest-mypy>=0.10.3,<1",
    "types-requests",
    "types-PyYAML",
    "mock>=5.1,<6",
    "types-mock>=5.1,<6",
]
# Training extras. Works on Python 3.10–3.12. ONNX-only (no TFLite).
# `deep-phonemizer` is opt-in (only needed for out-of-vocabulary wake words);
# install separately if you need it.
training = [
    "mutagen>=1.46.0,<2",
    "torch>=2.0,<3",
    "torchaudio>=2.0,<3",
    "torchinfo>=1.8.0,<2",
    "torchmetrics>=1.0,<2",
    "speechbrain>=1.0,<2",
    "audiomentations>=0.33.0,<1",
    "torch-audiomentations>=0.11.0,<1",
    "tqdm>=4.64.0,<5",
    "pyyaml>=6.0.1,<7",
    "pronouncing>=0.2.0,<1",
    "datasets>=2.14.4,<5",
    "soundfile>=0.12,<1",
    "librosa>=0.10,<1",
    "onnx>=1.16,<2",
    "webrtcvad>=2.0.10,<3",
    "piper-phonemize-fix; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/dscripka/openWakeWord"
"Bug Tracker" = "https://github.com/dscripka/openWakeWord/issues"

[tool.setuptools.packages.find]
include = ["openwakeword*"]

[tool.pytest.ini_options]
addopts = "--cov=openwakeword --cov-report term-missing --flake8 --mypy --mypy-ignore-missing-imports"
flake8-max-line-length = "140"
testpaths = [
    "tests",
    "openwakeword"
]
