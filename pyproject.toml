[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openwakeword"
version = "0.6.0"
authors = [
  { name="David Scripka", email="david.scripka@gmail.com" },
]
description = "An open-source audio wake word (or phrase) detection framework with a focus on performance and simplicity"
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# This fork is training-only; the inference deps + training deps are merged
# here so a single `uv sync` produces a working environment for both clip
# generation, augmentation, and ONNX training/export. ONNX-only (no TFLite).
# `deep-phonemizer` is opt-in (only needed for out-of-vocabulary wake words);
# install separately if you need it.
dependencies = [
    # ---- inference / shared ----
    'onnxruntime>=1.17.0,<2; platform_system != "Linux"',
    # On Linux + CUDA, onnxruntime-gpu is required so the Google
    # speech_embedding model runs on GPU during --augment_clips. Pinned
    # to 1.20.x — newer 1.21+ wheels have undefined-symbol issues
    # against torch's CUDA 12 libs.
    'onnxruntime-gpu>=1.20,<1.21; platform_system == "Linux"',
    'speexdsp-ns>=0.1.2,<1; platform_system == "Linux"',
    "tqdm>=4.0,<5.0",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "requests>=2.0,<3",
    'PyAudioWPatch; platform_system == "Windows" and platform_machine == "AMD64"',
    # ---- training ----
    "mutagen>=1.46.0,<2",
    # torch>=2.6 changed `torch.load` default to weights_only=True, which
    # rejects piper-sample-generator's pickled SynthesizerTrn checkpoint;
    # torchaudio>=2.9 removed `torchaudio.info` (used by torch_audiomentations
    # and openwakeword/data.py) and routes `torchaudio.load` through torchcodec.
    # Pinning <2.6 avoids both regressions; bumping requires patching upstream.
    "torch>=2.0,<2.6",
    "torchaudio>=2.0,<2.6",
    "torchinfo>=1.8.0,<2",
    "torchmetrics>=1.0,<2",
    "speechbrain>=1.0,<2",
    "audiomentations>=0.33.0,<1",
    # torch-audiomentations 0.12 changes Compose default output_type from
    # 'tensor' to 'dict' — breaks our usage silently. Pin <0.12 until we
    # explicitly migrate.
    "torch-audiomentations>=0.11.0,<0.12",
    "pyyaml>=6.0.1,<7",
    "pronouncing>=0.2.0,<1",
    # `datasets>=3` made torchcodec a hard requirement for the Audio feature
    # type, which is brittle on hosts whose ffmpeg ABI doesn't match the wheel
    # (Ubuntu 22.04 ships libavutil.so.56 but torchcodec wants 57+). Pin to
    # 2.x to keep the notebook-style streaming + Audio(sampling_rate=...) flow.
    "datasets>=2.14.6,<3",
    "soundfile>=0.12,<1",
    "librosa>=0.10,<1",
    "onnx>=1.16,<2",
    "webrtcvad>=2.0.10,<3",
    # webrtcvad imports `pkg_resources`, removed in setuptools>=81 (shipped
    # late 2025). Pin so webrtcvad keeps importing.
    "setuptools<81",
    "piper-phonemize-fix; platform_system == 'Linux'",
    "espeak-phonemizer>=1.3,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.0,<7",
    "pytest-flake8>=1.3.0,<2",
    "flake8>=5.0,<8",
    "pytest-mypy>=0.10.3,<1",
    "types-requests",
    "types-PyYAML",
    "mock>=5.1,<6",
    "types-mock>=5.1,<6",
]

# ---------------------------------------------------------------------------
# uv-specific configuration: pull torch + torchaudio from the PyTorch CUDA
# 12.4 index so the wheels include the bundled NVIDIA libs (cublas/cudnn/
# curand/...). On Linux + CUDA hosts this matches what install_training.sh
# used to do manually. Override CUDA build by changing the index URL or
# by setting `UV_INDEX=https://download.pytorch.org/whl/<flavor>`.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]

[project.urls]
Homepage = "https://github.com/dscripka/openWakeWord"
"Bug Tracker" = "https://github.com/dscripka/openWakeWord/issues"

[tool.setuptools.packages.find]
include = ["openwakeword*"]

[tool.pytest.ini_options]
addopts = "--cov=openwakeword --cov-report term-missing --flake8 --mypy --mypy-ignore-missing-imports"
flake8-max-line-length = "140"
testpaths = [
    "tests",
    "openwakeword"
]
