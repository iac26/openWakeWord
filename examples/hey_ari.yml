# Training config for the "hey ari" wake word.
# Paths assume install_training.sh + prepare_datasets.py have populated
# ./training_workspace/ at the repo root. Adjust if your layout differs.

model_name: "hey_ari"

# Both phrases are accepted wake words. Piper synthesises positives across
# the list (n_samples is split evenly), and adversarial negatives are
# generated per-phrase. n_samples is doubled below to keep ~100k positives
# per variant.
target_phrase:
  - "hey ari"

# Custom negative phrases should be CLEARLY DIFFERENT from the wake word
# — common phrases the system might encounter, NOT phonetic neighbours.
#
# Source: openWakeWord upstream evaluations (Neural Engineer / dscripka).
# Verbatim guidance: "training on phonetically similar phrases like
# 'hey call' or 'hey carl' actually hurts performance, and only clearly
# different phrases like 'hello', 'hey siri', 'alexa' should be used".
# Phonetic near-rhymes are already produced automatically by
# generate_adversarial_texts; that's where 'hey jealous' came from in
# the official hey_jarvis training set, NOT from a curated list.
#
# Add real false-positive triggers observed in deployment after the
# initial model is in use.
custom_negative_phrases:
  - "hello"
  - "hey siri"
  - "alexa"
  - "ok google"
  - "hey google"
  - "computer"
  - "hey jarvis"

# Synthetic positives. 200k = ~100k per phrase variant, matching the
# upstream alexa/hey_mycroft per-phrase training scale. Going below ~30k
# per variant noticeably hurts recall.
n_samples: 100000
n_samples_val: 4000

# tts_batch_size benefits from a big GPU (Piper synthesis is GPU-bound).
# augmentation_batch_size MUST stay at 16: torch_audiomentations augment2
# uses mode="per_batch" (one set of params per batch), so larger batches
# directly reduce augmentation diversity. Per-clip CPU prep is now
# pipelined via DataLoader workers, so 16 is no longer a speed bottleneck.
tts_batch_size: 256
augmentation_batch_size: 16

piper_sample_generator_path: "./training_workspace/piper-sample-generator"
output_dir: "./training_workspace/output"

rir_paths:
  - "./training_workspace/mit_rirs"

background_paths:
  - "./training_workspace/audioset_16k"
  # Add ./training_workspace/fma here too if you ran prepare_datasets.py
  # without --skip-fma (and bump background_paths_duplication_rate accordingly).

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./training_workspace/features/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./training_workspace/features/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

# Upstream defaults. These set per-step gradient batch shape, so changing
# them changes training dynamics (effective LR, convergence). Leave as-is
# to keep training behaviour equivalent to upstream openwakeword.
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "conv_attention"
# Conv1D blocks + multi-head self-attention + mean pool over time. Replaces
# the dnn head's Flatten(16x96)->Linear, which discards the temporal
# structure of the embedding sequence. Reference: livekit-wakeword
# (Apache-2.0). On their published "hey livekit" benchmark, conv_attention
# delivers ~60x lower AUT and ~100x fewer false positives per hour vs
# the flat dnn head.
#
# layer_size is the hidden dimension. 128 with n_heads=4 is a good default;
# must be divisible by n_heads.
layer_size: 128
n_heads: 4
n_conv: 2     # number of Conv1D(kernel=3) blocks
n_attn: 1     # number of MultiheadAttention blocks (residual + LayerNorm)

# Focal loss focuses gradient on hard examples. gamma=2 (livekit default)
# down-weights correctly-classified positives by (1-p)^2 — at p=0.7 the
# gradient is only 9% of plain BCE, so the optimizer stops pushing the
# score higher even though it could. That compresses the output
# distribution and forces a low deployment threshold. gamma=1 keeps the
# hard-example focus but the down-weighting is much gentler so easy
# positives keep climbing toward 1.0.
loss_type: "focal"
focal_gamma: 1.0

# Embedding mixup interpolates (x, y) pairs at training time, which
# produces SOFT labels — the model never sees a target of 1.0 for a
# 50%-mixed input and so never learns to confidently predict 1.0.
# Disabled because we want sharp scores on real audio at deployment;
# the regularization benefit is marginal compared to the calibration
# cost. Re-enable with a very small alpha (e.g. 0.05) if you start
# seeing overfitting symptoms.
embedding_mixup: false
mixup_alpha: 0.2

# 100k steps lets the larger model fully converge with the larger dataset.
steps: 100000

# auto_train ramps negative weight from 1 to max_negative_weight over
# sequence 1, then doubles it each subsequent sequence if FP rate is still
# above target. With the default 1500 + adversarial-negatives that include
# input words (now disabled), the gradient was so heavily skewed against
# negatives that the model under-fired on the real phrase. 750 + relaxed
# FP target loosens that pressure; the focal loss + better adversarial
# generation handle the tail.
max_negative_weight: 750
target_false_positives_per_hour: 0.5
