# Training config for the "hey ari" wake word.
# Paths assume install_training.sh + prepare_datasets.py have populated
# ./training_workspace/ at the repo root. Adjust if your layout differs.

model_name: "hey_ari"

target_phrase:
  - "hey ari ."
  - "hey ari !"
  - "hey ari ?"

# No custom negative phrases — the auto-generated phonetic
# adversarials from generate_adversarial_texts (the model still
# learns to reject 'except', 'accent', etc.) plus ACAV100M's
# 2000 hr of real audio cover the negative space without curated
# noise. Add specific terms here later only if production false
# positives reveal a class the auto adversarials miss.
custom_negative_phrases: []

# Synthetic positives. 200k = ~100k per phrase variant, matching the
# upstream alexa/hey_mycroft per-phrase training scale. Going below ~30k
# per variant noticeably hurts recall.
n_samples: 100000
n_samples_val: 4000

# tts_batch_size benefits from a big GPU (Piper synthesis is GPU-bound).
# augmentation_batch_size MUST stay at 16: torch_audiomentations augment2
# uses mode="per_batch" (one set of params per batch), so larger batches
# directly reduce augmentation diversity. Per-clip CPU prep is now
# pipelined via DataLoader workers, so 16 is no longer a speed bottleneck.
tts_batch_size: 256
augmentation_batch_size: 16

piper_sample_generator_path: "./training_workspace/piper-sample-generator"
output_dir: "./training_workspace/output"

rir_paths:
  - "./training_workspace/mit_rirs"

background_paths:
  - "./training_workspace/audioset_16k"
  # Add ./training_workspace/fma here too if you ran prepare_datasets.py
  # without --skip-fma (and bump background_paths_duplication_rate accordingly).

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./training_workspace/features/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./training_workspace/features/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

# Upstream defaults. These set per-step gradient batch shape, so changing
# them changes training dynamics (effective LR, convergence). Leave as-is
# to keep training behaviour equivalent to upstream openwakeword.
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "conv_attention"
# Conv1D blocks + multi-head self-attention + mean pool over time. Replaces
# the dnn head's Flatten(16x96)->Linear, which discards the temporal
# structure of the embedding sequence. Reference: livekit-wakeword
# (Apache-2.0). On their published "hey livekit" benchmark, conv_attention
# delivers ~60x lower AUT and ~100x fewer false positives per hour vs
# the flat dnn head.
#
# layer_size is the hidden dimension. 128 with n_heads=4 is a good default;
# must be divisible by n_heads.
layer_size: 128
n_heads: 4
n_conv: 2     # number of Conv1D(kernel=3) blocks
n_attn: 1     # number of MultiheadAttention blocks (residual + LayerNorm)

# Focal loss + embedding mixup as published by livekit-wakeword. We
# briefly tried gamma=1 + mixup off to push trained scores past ~0.6;
# that hurt the model on real audio enough to be worse overall. Back to
# the upstream defaults. If we want sharper post-hoc scores, do it with
# temperature scaling at inference rather than by weakening the loss.
loss_type: "focal"
focal_gamma: 2.0
embedding_mixup: true
mixup_alpha: 0.2

# Label smoothing: replace hard 0/1 targets with eps/2 and 1-eps/2 at
# training time. Modest regularizer; livekit-wakeword uses it. 0.05 is
# conservative — set to 0.0 to disable. Stacks fine with focal + mixup.
label_smoothing: 0.05

# AdamW weight decay. 0.01 is the standard AdamW default; livekit uses
# this too. Set to 0.0 for legacy plain-Adam behaviour.
weight_decay: 0.01

# Post-hoc temperature scaling baked into the exported ONNX:
#   s' = sigmoid(T * logit(s))
# T > 1 sharpens the score distribution: 0.5 stays fixed, scores above
# 0.5 climb toward 1, scores below 0.5 collapse toward 0. Default 1.0
# (no-op) until you've seen the post-training threshold sweep. Cranking
# T up on a model whose real-audio "hey ari" scores live below 0.5 will
# make the model never fire — pick T based on the sweep's recommended
# threshold + observed score distribution, not blindly.
inference_temperature: 1.0

# Piper sampling temperature — verified by listening that 0.98 (the
# upstream default) produces partially-garbled positives for short
# commands. For hey_ari (4 syllables) the impact is smaller because
# of phonetic redundancy, but 0.667 (Piper's own default) produces
# cleaner clips without giving up much diversity. Augmentation
# (RIRs + AudioSet) provides per-clip variation independently.
noise_scales: [0.667]
noise_scale_ws: [0.8]
noise_scales_val: [0.667]
noise_scale_ws_val: [0.8]

# Gender-balanced synthetic positives. Piper's libritts speaker pool is only
# ~12% female-range (median F0 ~138 Hz), so an unweighted "hey ari" model
# under-fires for women. speaker_f0_path points at a {speaker_id: median_f0_hz}
# map (regenerate with scripts/measure_speaker_f0.py if you change the voice
# model); training then oversamples speakers per speaker_band_targets so the
# positives reach a ~balanced split that also covers higher female pitches.
# Remove speaker_f0_path to revert to the upstream unweighted behaviour.
speaker_f0_path: "./training_workspace/piper-sample-generator/models/en-us-libritts-high.pt.f0.json"
speaker_band_targets:    # [low_hz, high_hz, share_of_positives]
  - [0, 150, 0.38]
  - [150, 175, 0.27]
  - [175, 200, 0.22]
  - [200, 250, 0.10]
  - [250, 9999, 0.03]

# 100k steps lets the larger model fully converge with the larger dataset.
steps: 100000

# auto_train ramps negative weight from 1 to max_negative_weight over
# sequence 1, then doubles it each subsequent sequence if FP rate is still
# above target. With the default 1500 + adversarial-negatives that include
# input words (now disabled), the gradient was so heavily skewed against
# negatives that the model under-fired on the real phrase. 750 + relaxed
# FP target loosens that pressure; the focal loss + better adversarial
# generation handle the tail.
max_negative_weight: 750
target_false_positives_per_hour: 1.0
