# decline FULL tier — 100k samples, ~178k-param head (v5 architecture).
#
# Top of the decline_micro -> decline_tiny -> decline_small -> decline
# tier chain. Reuses smaller-tier WAVs:
#   scripts/promote_clips.sh decline_small decline
#   ./run_train.sh --training_config configs/decline.yml \
#       --generate_clips --augment_clips --train_model
#
# tts_batch_size 256 is sized for cloud GPUs. On a 4 GB laptop GPU,
# lower to 16 — but the full tier is meant for cloud (~6 hr).

model_name: "decline"

target_phrase:
  - "decline ."
  - "decline !"
  - "decline ?"

# No custom negative phrases — the auto-generated phonetic
# adversarials from generate_adversarial_texts (the model still
# learns to reject 'except', 'accent', etc.) plus ACAV100M's
# 2000 hr of real audio cover the negative space without curated
# noise. Add specific terms here later only if production false
# positives reveal a class the auto adversarials miss.
custom_negative_phrases: []

n_samples: 100000
n_samples_val: 2000

# Cloud-sized batch. On laptop GPU, lower to 16.
tts_batch_size: 256
augmentation_batch_size: 16

piper_sample_generator_path: "./training_workspace/piper-sample-generator"
output_dir: "./training_workspace/output"

rir_paths:
  - "./training_workspace/mit_rirs"
background_paths:
  - "./training_workspace/audioset_16k"
background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./training_workspace/features/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./training_workspace/features/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

# Piper sampling — verified by listening that 0.98 (the upstream
# default) produces partially-garbled "decline" clips. 0.667 (Piper's
# own default) gives clean phonemes; per-clip diversity comes from
# augmentation (RIRs + AudioSet noise) instead of sampling noise.
noise_scales: [0.667]
noise_scale_ws: [0.4]
noise_scales_val: [0.667]
noise_scale_ws_val: [0.4]

# Narrower than the upstream [0.5..1.33] default — see accept.yml.
length_scales: [1.1, 1.2, 1.3]
# v5 architecture — same conv_attention head as hey_ari.yml.
model_type: "conv_attention"
layer_size: 128
n_heads: 4
n_conv: 2
n_attn: 1

loss_type: "focal"
focal_gamma: 2.0
embedding_mixup: true
mixup_alpha: 0.2
label_smoothing: 0.05
weight_decay: 0.01
inference_temperature: 1.0

steps: 100000
max_negative_weight: 750
target_false_positives_per_hour: 1.0
